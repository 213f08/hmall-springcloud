spring:
  application:
    name: trade-service # 服务名称
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: localhost:8848 # nacos 地址
      config:
        file-extension: yaml # 文件后缀名
        shared-configs: # 共享配置
          - dataId: shared-jdbc.yaml # 共享 jdbc、mybatis-plus 配置
          - dataId: shared-log.yaml # 共享日志配置
          - dataId: shared-swagger.yaml # 共享 knife4j 配置
          - dataId: shared-seata.yaml # 共享 seata 分布式事务配置
          - dataId: shared-mq.yaml # 共享 RabbitMQ 连接配置
