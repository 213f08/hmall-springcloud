# 复制本文件为 application-local.yaml 并填入你自己的值（application-local.yaml 不入库）
# hmall.jks 需自行生成：
# keytool -genkeypair -alias hmall -keyalg RSA -keypass <你的密码> -keystore hmall.jks -storepass <你的密码>
hm:
  db:
    host: localhost          # 你的 MySQL 地址
    pw: <你的 MySQL root 密码>
  jwt:
    pw: <上面生成 keystore 时用的密码>
